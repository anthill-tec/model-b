[gotchas]
red = '''
- **Run only YOUR tests:** `test --crate <c> --filter 'test(/<your_pattern>/)' --agent YOUR_AGENT_ID` — never a whole test file unfiltered; report only your new tests' results, not pass counts carried over from prior cycles. Compile-failure RED: `check --crate <c> --tests --agent YOUR_AGENT_ID`.
- **SUT compile failure vs. RED-agent bug.** A compile error because the target type/field/fn does not exist YET is a valid RED. A compile error because you called a method that does not exist on a THIRD-PARTY type is your bug and wastes a cycle — verify every unfamiliar crate API against the source at the `Cargo.lock` version before using it (see "Stack mechanics"), and match how sibling tests already use that crate.
- **Mode 2 (fix test compilation):** use the `refactorer-rust` skill for renames, `use` rewrites and signature migrations across files — its tool priority is `cargo fix` > `ast-grep` > `cargo clippy --fix` > manual `Edit`. No `sed`/`awk` on `.rs` files. Tests must COMPILE after Mode 2; they may still fail.
- **Structure:** `#[cfg(test)] mod tests { use super::*; … }` at the bottom of the module; group with nested `mod`s if organisation matters — never a separate `<thing>_tests.rs` in `src/`. Cross-module tests go in `<crate>/tests/<feature>.rs`.
- **Async:** `#[tokio::test]` only in crates that already depend on tokio. Respect the project's crate-boundary rules in tests too — a test must not pull an async runtime or I/O crate into a crate whose boundary forbids it.
- **Assertions:** `assert_eq!`/`assert_ne!` with a message naming the expectation; for a `Result`, assert the specific `Err` variant or message, not just `is_err()`; use `pretty_assertions::assert_eq` for large structures when the workspace already depends on it.
- **Timing:** never `std::thread::sleep`. Bound every wait with `tokio::time::timeout` around a polling loop, and every rate/count assertion with BOTH ends (`n >= 5 && n <= 12`).
- **Feature-gated targets:** pass the gating `--features` and confirm the test count rose — otherwise your tests were never compiled and the ingest reports a false green.
- **Prohibited:** `#[ignore]` on a new test; `unsafe` in tests (needing it means the API design is wrong); `.unwrap()` in complex test setup without a `// test: guaranteed by setup` comment; CR- or cycle-named test files or test functions.
'''
green = '''
**Rust code quality (NON-NEGOTIABLE):**
1. **No `.unwrap()` in production code.** Propagate with `?`, convert with `.ok_or(..)?` / `.map_err(..)?`, or — only where a value is safe by construction — `.expect("why this cannot fail")`. `.unwrap()` belongs in `#[cfg(test)]` code only.
2. **Never silently swallow an error.** `if let Ok(x) = fallible() { … }` with no else, and `let _ = fallible();`, are forbidden. Propagate, or handle visibly (log + act).
3. **Fallible functions return `Result`.** Never hide a failure behind a `Self` return; if the spec says `Self` but the work can fail, `ESCALATION:` — do not paper over it.
4. **No `#[allow(dead_code)]` without a justification comment** naming the future caller — better, remove the dead code. No unused parameters; an `_name` binding is for a genuinely-unneeded argument and carries a comment saying why.
5. **Exhaustive matches.** A new enum variant means updating EVERY match site (`rg 'match ' crates/` to find them) — never an `_ =>` arm that hides the new variant (E0004 is the compiler telling you where).
6. **Self-check before commit:** any `.unwrap()` in production? any discarded `Result`? any unjustified `#[allow(...)]`? any fallible fn not returning `Result`? unused imports (`check` warns)? Fix first.

**Rust implementation conventions:**
- **Module layout:** `//!` module doc → internal `use crate::…` → external crates → public types/fns with `///` docs → `impl` blocks → private helpers → `#[cfg(test)] mod tests` at the very bottom. Re-export the public API from `lib.rs` the way the crate already does.
- **Errors:** typed library errors via `thiserror` (`#[derive(Debug, thiserror::Error)]`, one variant per failure with its context); `anyhow` only at a binary's top level — match whatever the crate's siblings already use.
- **Feature flags are additive:** never put code behind a flag that REMOVES something available without it. When your code is feature-gated, `check` it with the default feature set AND with the gating features.
- **Crate boundaries:** the project's CLAUDE.md names which crates may depend on what (e.g. a pure AST crate with no async runtime or I/O). Adding a forbidden dependency is a design change — `ESCALATION:`, never just add it.
- **Mechanical multi-file changes** (renames, `use` rewrites, signature changes): the `refactorer-rust` skill — `cargo fix` > `ast-grep` > `cargo clippy --fix` > manual. No `sed` on `.rs`.
- **After each file:** `check --crate <c> --agent YOUR_AGENT_ID`. **Before finishing:** `clippy --crate <c> --deny-warnings --agent YOUR_AGENT_ID` and fix every warning.
'''
verify = '''
- **Stack read-only tool lists:** ALLOWED — the client's `test` / `check` / `clippy` verbs on the AFFECTED crates only (from the dispatch prompt or `git diff develop...HEAD --stat`), `git log`/`diff`/`show`, read-only search. FORBIDDEN — `cargo fix` and `cargo fmt` (both write files), any `git` write, and every orchestrator gate: `workspace-regression`, `regression-ingest`, `smoke-test`, `pre-merge-gate`, `docker-e2e-gate`, any `--workspace` run, any llvm-cov run. If you suspect cross-crate breakage, flag it as a finding — do not run the workspace yourself.
- **Clippy is a gate here:** `clippy --crate <c> --deny-warnings --agent YOUR_AGENT_ID` per affected crate; report Clippy PASS/FAIL.
- **Crate boundaries:** check each affected crate's `Cargo.toml` `[dependencies]` against the boundary rules the project's CLAUDE.md declares (e.g. a pure crate gaining an async runtime or I/O crate); check feature flags are additive (a smaller feature set is a subset of a larger one) and that gated code compiles both with and without its flag. Report Crate Boundaries PASS/FAIL.
- **Code quality review:** exhaustive matches (no `_ =>` hiding new variants); no `.unwrap()` / `panic!()` / unjustified `.expect()` in library code; `Result` + `thiserror` used consistently with sibling error types; no needless `.clone()` where a borrow suffices; snake_case fns, CamelCase types, SCREAMING_CASE consts; no unused imports and no `use crate::module::*` globs in production; no commented-out code, no new `#[allow(dead_code)]`/`#[allow(unused)]` without justification; no `unsafe` unless necessary and documented; `///` docs on public items; derive consistency (`Debug`, `Clone`, `PartialEq`, serde derives) with neighbouring types.
- **Wiring (stack flavour):** every new `pub fn` is called outside `#[cfg(test)]` (`rg 'fn_name(' crates/ --glob '!**/tests/**'`); config fields traced config file → parsed struct → constructor/builder → runtime behaviour; every variant/mode the spec lists is wired, not just the first; registered callbacks are actually fired; persisted state round-trips (save on trigger AND load on startup).
- **Common regression signatures:** E0004 (non-exhaustive match — a new variant missed a match site); E0063 (missing struct field — constructors not updated); E0659 (ambiguous name — glob imports clash); passes locally but fails elsewhere (a feature-flag difference); a hanging test (an `.await` inside a plain `#[test]` — needs `#[tokio::test]`).
- **Report skipped and ignored tests explicitly**, with the total test count — a bare count hides `#[ignore]` holes. Gate: any test failure, clippy failure, boundary violation, newly added `#[ignore]`, or unjustified new `#[allow(...)]` blocks approval.
'''
fix = '''
**Common Rust fixes:**
| Finding | Fix |
|---|---|
| Unused imports | `check --crate <c>` names them; remove the `use` line (don't fully-qualify elsewhere to compensate). |
| Non-exhaustive match (E0004) | Add the missing arm(s) with real handling — never an `_ =>` wildcard hiding the new variant. |
| Missing struct field (E0063) | Add the field at every constructor with its correct default (`Vec::new()`, `None`, …). |
| Type mismatch | Change the EXPRESSION to fit the field type — not the field type, which has downstream consumers. |
| Method vs field access | `src.name()` calls a method; `src.name` reads a field — use what the type actually defines. |
| `.unwrap()` in production | `?`, `.ok_or(..)?` / `.map_err(..)?`, or `.expect("why")` where safe by construction. |
| Swallowed error | Propagate with `?` or handle visibly; never `if let Ok(..)` with no else or `let _ = fallible()`. |
| Clippy warnings | `clippy --crate <c> --deny-warnings --agent YOUR_AGENT_ID`; typical fixes: `&String` → `&str` in params, drop a `.clone()` where a borrow suffices, `if let Some(x) = o { x } else { d }` → `o.unwrap_or(d)`. |
| Test in a CR/cycle-named file | ESCALATE — relocating it is a separate orchestrator-approved consolidation step, not a one-off fix. |
- **Per finding:** `test --crate <c> --filter 'test(/<relevant_test>/)' --agent YOUR_AGENT_ID`, then `check --crate <c> --agent YOUR_AGENT_ID` to catch cascades, then commit that one fix.
- **Mechanical multi-file changes:** the `refactorer-rust` skill (`cargo fix` > `ast-grep` > `cargo clippy --fix` > manual); `Edit` for a trivial known old→new; no `sed` on `.rs`.
- **Respect crate boundaries** (a fix in a pure crate must not introduce an I/O or async dependency) and **feature gates** (test gated code with its `--features`; confirm the test count).
- Targeted crates only — never a workspace run, never llvm-cov; coverage is the orchestrator's gate.
'''
