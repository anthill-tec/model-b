[gotchas]
red = '''
- **Add the module under test to `MODULES`** in the `Makefile`; drop a `test_<feature>.cpp` (auto-discovered).
- **The harness, not a framework:** `TEST(name){ ... }`, `CHECK(cond)`, `CHECK_EQ(a,b)`, `CHECK_NEAR(a,b,eps)`. No bun:test/gtest idioms.
- **Verify the test COUNT increased.** N new cases but the total didn't move = the file was silently not compiled (not in the `make` SRC) — never trust a 0-failure result without checking the count.
- **AC cross-check (stack flavour):** copy EXACT names/types/values from the CR — struct fields, enum variants (e.g. exact `CfgKey` variants), method signatures, exact default values, exact formatted strings, exact RGB565 numbers. Assertions POSITIVE with a SPECIFIC value (`CHECK_EQ(resolve(0,W_ARC,CK_ARC_SPAN), 270)`), plus boundary/negative where the spec implies one, plus the error/clamp path.
- **E2E outcome flavour:** the real observable outcome is the device's output/state, serial response, a HIL/sim measurement, pin levels — never merely "the sketch compiled"; failure channel = error/fault flags clear; round-trip protocol frames / struct packing / serial-I2C-SPI payloads across BOTH sides.
- **Conventions:** native unit tests in `sheetal-firmware/tests/native/test_<feature>.cpp`; `TEST(<behaviour>_<scenario>)`.
- **Prohibited:** forcing a hardware module into the native thin-stub target (use ArduinoFake/HIL; ESCALATE if absent).
'''
green = '''
- **Both builds must stay green.** After implementing: (a) **L1** native test GREEN via `make`/the stack client; (b) **L0** `arduino-cli compile --fqbn arduino:renesas_uno:minima --build-path ./build .` from `sheetal-firmware/` must still compile. A firmware change that passes native tests but breaks the target build is NOT done. If L0 fails, ingest the compile error (`arduino-crucible.py compile`) and fix before moving on.
- **Keep the dependency direction** (CLAUDE.md): `Widget`/`Style` pure (no graphics/HW); `Dashboard` → Arduino_GFX; injected deps (constructor/callback), no cross-module globals. Don't introduce a hardware include into a pure module — it breaks L1.
- **Pure-module impl only needs the host build to pass the test;** code touching `Wire`/`SPI`/`Arduino_GFX`/`Stream` won't be exercised by L1 — make it compile (L0) and structure it for L2/L3, but never fake a pass by gutting hardware calls.
- **Run the failing test first** (`arduino-crucible.py unit` / `make junit`) and confirm it fails for the RIGHT reason before implementing; read the module under test + its header (`ctx_read mode:"signatures"`).
- **Style:** match existing (`#define`s at top of `.cpp`, `RGB565_*` colours, no dead code, clean includes; no fully-qualified inline names). Commit style `feat|fix(<CR-ID>): ...`.
- **Prohibited:** committing with a broken `arduino-cli` build; putting a hardware include into a pure module; big-bang across modules; skipping the L0 compile gate.
'''
verify = '''
- **Gates to run INDEPENDENTLY:** (1) full native suite (regression) + ingest — `arduino-crucible.py regression --agent YOUR_AGENT_ID --project-dir sheetal-firmware` (the `regression` tier with coverage lands in CR-SHE-006; until then use `unit`); read the JUnit, report the REAL counts. (2) **L0 compile** — `arduino-cli compile --fqbn arduino:renesas_uno:minima --build-path ./build sheetal-firmware` — must build; report flash/RAM. (3) **Coverage** (when CR-SHE-006 lands): lcov summary; judge adequacy of YOUR-CR lines, not the whole repo. (4) Where the CR involves hardware/protocol and L2/L3/L4 exist: run/inspect them; else file the gap.
- **Match the verification to what the CR touches.** A pure-logic CR is fully verifiable at L1. A CR touching `Wire`/`Arduino_GFX`/`Stream`/the serial protocol is NOT fully verified by L1 alone — its behaviour lives at L2/L3/L4. If the required tier isn't built yet, that is a **coverage gap finding** ("hardware/e2e behaviour unverified — needs L3 HIL / L4 sim"), not a pass. Never sign off hardware behaviour on a green native suite alone.
- **Layer boundary:** pure modules (`Widget`/`Style`) carry no `Arduino_GFX`/`Wire`/`Stream`/`EEPROM` include; dependency direction (CLAUDE.md) preserved; deps injected, no cross-module globals.
- **Code quality:** unused includes, dead code, null/`nullptr` safety, `RGB565_*` vs raw values, matches house style.
- **Test-quality flavour:** flag a test that only proves "no assert-fail / it compiled" without asserting the real observed outcome AND clear fault flags; investigation trivial-cause-first BEFORE the complex machinery (timing, ISRs, races).
- **Report:** per-AC PASS/FAIL with evidence (test name / file:line / value); independent gate results (native counts, compile flash/RAM, coverage); any e2e/hardware coverage gaps (L2/L3/L4 not run/built); conclude VERIFIED or NOT-VERIFIED.
'''
fix = '''
- **A fix must leave all applicable layers green** — at minimum L1 (native) + L0 (`arduino-cli compile ... sheetal-firmware` clean; ingest a compile error if it breaks). If the finding is at L2/L3/L4 and that tier exists, re-run it.
- **Reproduce the finding** (run the failing/missing gate) before changing anything.
- **Caller-existence findings** are fixed by wiring the real caller, not by deleting the API or adding a test caller. **Boundary findings** (a hardware include leaked into a pure module) are fixed by restoring the seam (move the dependency behind injection/callback), not by suppressing the symptom.
- **Final gate:** full native suite + ingest (GREEN) and final `arduino-cli compile` clean — confirm no finding regressed another. Commit style `fix(<CR-ID>): <finding summary>`.
- **Style:** clean includes, no dead code, match house style; verify library APIs against `~/.opensrc/repos/github.com/moononournation/Arduino_GFX/v1.6.5/src` (never from memory).
'''
