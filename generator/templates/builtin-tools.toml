# The built-in form of the role templates (CR-MDB-045 §S8; PRD D10, amended 2026-09-27).
#
# The role templates beside this file are written for an agent that has lean-ctx.
# When the installation does not record lean-ctx present, `modelb-axi init` and
# `modelb-axi agents` render each agent for Pi's built-in tools instead
# (`modelb_axi.agents`): every `ctx_*` tool leaves the allowlist, `bash` takes
# `ctx_shell`'s place, and each passage below replaces its lean-ctx text in the
# rendered definition — the role templates and the stack files alike. A rendered
# definition that still names lean-ctx is refused, so a template edit that adds a
# lean-ctx passage adds its built-in form here too.
#
# Each [[passage]] is an exact text `lean` and its built-in form `builtin`.
# `generator/agents/` and `build.py` keep the lean-ctx form; this file is read only
# for the built-in form.

# --- The preamble every role template opens with. -----------------------------

[[passage]]
lean = '''
**Reading outside the repository (NON-NEGOTIABLE).** For any path outside the project — installed
skills (`~/.agents/`), Crucible clients (`~/.crucible/`), the installed harness — use the built-in
`read`, `grep`, `find` or `ls`, never a `ctx_*` tool. The permission system proves the built-ins
read-only; an extension tool's direction is unproven, so it is also checked against the write
policy and prompts the user. Inside the project, `ctx_*` stays the default.
'''
builtin = '''
**Reading outside the repository (NON-NEGOTIABLE).** For any path outside the project — installed
skills (`~/.agents/`), Crucible clients (`~/.crucible/`), the installed harness — use `read`,
`grep`, `find` or `ls`, never `cat`, `head` or `ls` through `bash`. The permission system proves
those four tools read-only; a shell command's direction is unproven, so it is also checked against
the write policy and prompts the user. Inside the project, read and search with the same four tools
too, and keep `bash` for running commands.
'''

