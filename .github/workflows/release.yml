# Release workflow: the one workflow of this repository. Its test job
# runs the unittest suite, and every publish job needs it.
#
# The test job runs in every run. The test job carries no if: and must
# never be scoped: `needs:` orders jobs only within one run, and a
# publish that needs a skipped job is itself skipped, silently. It runs
# the suite directly, not through a Crucible client, because it runs
# outside any agent session (DN-multi-harness-deploy-model §D21); the
# suite needs `uv` on PATH and the full git history.
#
# - A release or hotfix push runs the tests and the rehearsal.
# - A master push runs the tests and create-release, which releases the
#   version tag at HEAD.
# - A published release runs the tests and the guarded registry publishes.
# Every publish needs the tests.
#
# A git-flow release pushes master, develop and the unprefixed version
# tag in one push (`git flow release finish X.Y.Z`, then
# `git push origin master develop --tags`). The jobs:
#
# 1. create-release: on the master push, creates the GitHub Release
#    for the X.Y.Z tag at HEAD with RELEASE_PAT. A Release made with
#    the default GITHUB_TOKEN does not fire `on: release` workflows,
#    so nothing would publish. The release body is the tag's
#    CHANGELOG.md section, printed by .github/scripts/changelog_section.py;
#    a tag with no section, or an empty one, fails the job. An existing
#    release is left as it is. No version tag at HEAD: nothing to
#    release; two: the job fails.
# 2. publish-pypi: on the release event, guards the ref (an X.Y.Z tag
#    on master's history), then builds and uploads `modelb-axi` through
#    PyPI Trusted Publishing (no token).
# 3. publish-npm: on the release event, the same guard, then publishes
#    `@anthill-tec/modelb-pi` with provenance through npm Trusted
#    Publishing. The very first publish of the package uses the
#    one-time NPM_TOKEN secret instead, because npm cannot bootstrap a
#    trusted publisher. The package ships the root CHANGELOG.md, copied
#    into pi-package/ at publish time.
# 4. rehearse: every release or hotfix push (`release/X.Y.Z`,
#    `hotfix/X.Y.Z`) rehearses the release. It stamps the dev version
#    X.Y.Z.devN (npm: X.Y.Z-dev.N, N the run number) with
#    .github/scripts/stamp_version.py, which refuses a committed
#    version other than X.Y.Z; checks the release's CHANGELOG.md
#    section; uploads the build to TestPyPI; and dry-runs the npm
#    publish under the `dev` dist-tag. A manual run
#    (workflow_dispatch) on a release or hotfix ref re-runs the
#    rehearsal; on any other ref it skips it.
#
# Recovery: when the master run finds no version tag at HEAD, dispatch
# the workflow on master.
#
# One-time setup by the maintainer:
# - repository secret RELEASE_PAT: fine-grained, owner anthill-tec,
#   this repository only, Contents read/write;
# - environments `pypi`, `testpypi` and `npm`; the `testpypi`
#   environment admits the `release/**` and `hotfix/**` branches and
#   carries no required reviewers;
# - pending Trusted Publishers on pypi.org and test.pypi.org for this
#   workflow;
# - NPM_TOKEN for the first npm publish, deleted once the npm trusted
#   publisher exists.
# See docs/research/release-automation-crucible-procedure.md.

name: release

on:
  push:
    branches: [master, "release/**", "hotfix/**"]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - name: Run the suite
        env:
          MODELB_HOME: ${{ runner.temp }}/modelb-home
          XDG_DATA_HOME: ${{ runner.temp }}/xdg-data
          PI_CODING_AGENT_DIR: ${{ runner.temp }}/pi-agent
        run: python -m unittest discover -s tests -t .

  create-release:
    needs: test
    if: >-
      github.ref == 'refs/heads/master' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: The version tag at HEAD
        id: tag
        run: |
          tags=$(git tag --points-at HEAD | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' || true)
          count=$(printf '%s' "$tags" | grep -c . || true)
          if [ "$count" -gt 1 ]; then
            echo "::error::more than one version tag at HEAD: $(echo $tags)"
            exit 1
          fi
          if [ -z "$tags" ]; then
            echo "::notice::no version tag at HEAD — nothing to release"
          fi
          echo "tag=$tags" >> "$GITHUB_OUTPUT"
      - name: Tag matches the package version
        if: steps.tag.outputs.tag != ''
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          python3 - <<'PY'
          import os, pathlib, re, sys
          text = pathlib.Path("modelb_axi/__init__.py").read_text()
          version = re.search(r'__version__\s*=\s*"([^"]+)"', text)[1]
          tag = os.environ["TAG"]
          if version != tag:
              sys.exit(f"tag {tag} != __version__ {version}")
          PY
      - name: Create the GitHub Release
        if: steps.tag.outputs.tag != ''
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          python3 .github/scripts/changelog_section.py CHANGELOG.md "$TAG" > "$RUNNER_TEMP/notes.md"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag
          fi

  publish-pypi:
    needs: test
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Guard - a version tag on master's history
        run: |
          if ! [[ "$GITHUB_REF" =~ ^refs/tags/[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::refusing to publish: $GITHUB_REF is not an X.Y.Z tag ref"
            exit 1
          fi
          git fetch --no-tags origin master
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
            echo "::error::refusing to publish: $GITHUB_SHA is not on origin/master"
            exit 1
          fi
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  rehearse:
    needs: test
    if: >-
      (startsWith(github.ref, 'refs/heads/release/') ||
       startsWith(github.ref, 'refs/heads/hotfix/')) &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Stamp the dev version and check the release notes
        run: |
          version=$(python3 .github/scripts/stamp_version.py "$GITHUB_REF_NAME" "$GITHUB_RUN_NUMBER")
          python3 .github/scripts/changelog_section.py CHANGELOG.md "$version" > /dev/null
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: npm new enough for the dry-run publish
        run: npm install -g npm@latest
      - name: Ship the root CHANGELOG.md in the package
        working-directory: pi-package
        run: cp ../CHANGELOG.md .
      - name: Dry-run the npm publish
        working-directory: pi-package
        run: npm publish --dry-run --access public --tag dev

  publish-npm:
    needs: test
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: pi-package
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Guard - a version tag on master's history
        run: |
          if ! [[ "$GITHUB_REF" =~ ^refs/tags/[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::refusing to publish: $GITHUB_REF is not an X.Y.Z tag ref"
            exit 1
          fi
          git fetch --no-tags origin master
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
            echo "::error::refusing to publish: $GITHUB_SHA is not on origin/master"
            exit 1
          fi
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
      - name: npm new enough for Trusted Publishing
        run: npm install -g npm@latest
      - name: Ship the root CHANGELOG.md in the package
        run: cp ../CHANGELOG.md .
      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public
