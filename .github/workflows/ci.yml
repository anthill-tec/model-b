# CI workflow: runs the unittest suite on every push to develop,
# release/** or hotfix/**, on every pull request, and on demand.
#
# It runs the suite directly, not through a Crucible client, because CI
# runs outside any agent session (DN-multi-harness-deploy-model §D21).
# The suite needs `uv` on PATH and the full git history.

name: ci

on:
  push:
    branches: [develop, "release/**", "hotfix/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - name: Install the build frontend
        run: python -m pip install build
      - name: Run the suite
        env:
          MODELB_HOME: ${{ runner.temp }}/modelb-home
          XDG_DATA_HOME: ${{ runner.temp }}/xdg-data
          PI_CODING_AGENT_DIR: ${{ runner.temp }}/pi-agent
        run: python -m unittest discover -s tests -t .
