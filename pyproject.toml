[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "modelb-axi"
dynamic = ["version"]
description = "Installs agent skills, sub-agents and lifecycle hooks into coding-agent harnesses, and scaffolds new projects to use them."
readme = "docs/install-guide.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
classifiers = [
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.scripts]
modelb-axi = "modelb_axi.cli:main"

# One version source: modelb_axi/__init__.py `__version__`, read at build time.
[tool.hatch.version]
path = "modelb_axi/__init__.py"

# Flat layout next to unrelated repo dirs (tests/, docs/, audits/, contracts/, ...):
# contracts/ is repo-only documentation with no runtime consumer (CR-MDB-031 §S4). Ship
# the modelb_axi package as code, plus the asset roots (CR-MDB-014 §S2 tail)
# force-included INSIDE the package under modelb_axi/_assets/ so an installed
# wheel resolves default_asset_root() to real package data. Hatchling prunes
# __pycache__/.venv from force-include walks by default (EXCLUDED_DIRECTORIES).
[tool.hatch.build.targets.wheel]
packages = ["modelb_axi"]

[tool.hatch.build.targets.wheel.force-include]
"skills-src" = "modelb_axi/_assets/skills-src"
"generator" = "modelb_axi/_assets/generator"
"scripts" = "modelb_axi/_assets/scripts"
"hooks-src" = "modelb_axi/_assets/hooks-src"

# uv caches a local-directory build and, by default, rebuilds it only when
# pyproject.toml/setup.py/setup.cfg change -- so `uv tool install .` after a
# source change could install a STALE wheel missing new modules or assets (the
# CR-MDB-014/022 missing-asset class; CR-MDB-025 §S6 AC2). Key the cache on
# everything the wheel ships.
[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "LICENSE" },
    { file = "docs/install-guide.md" },
    { file = "modelb_axi/**/*.py" },
    { file = "skills-src/**" },
    { file = "generator/**" },
    { file = "scripts/**" },
    { file = "hooks-src/**" },
]

[tool.hatch.build.targets.sdist]
only-include = [
    "modelb_axi",
    "pyproject.toml",
    "LICENSE",
    "docs/install-guide.md",
    "skills-src",
    "generator",
    "scripts",
    "hooks-src",
]
