  test-python:
    runs-on: ubuntu-latest
    steps:
      - uses: @@USES:actions/checkout@@
        with:
          fetch-depth: 0
      - uses: @@USES:actions/setup-python@@
        with:
          python-version: "3.14"
      - uses: @@USES:astral-sh/setup-uv@@
      - name: Run the tests
        run: python -m unittest discover -s tests -t .
